name: PineLab Android build

on:
  push:
    branches: [ pinelab-independent ]
    paths:
      - 'PineLab/**'
      - '.github/workflows/pinelab-android-build.yml'
  workflow_dispatch:

concurrency:
  group: pinelab-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PineLab
        uses: actions/checkout@v4
      - name: Checkout Resin source
        uses: actions/checkout@v4
        with:
          repository: nullarch/resin
          ref: main
          path: PineLab/engine/vendor/resin
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Patch Resin negative numeric plot metadata
        run: node PineLab/engine/patch-resin.mjs
      - name: Bundle Resin for offline WebView
        working-directory: PineLab/engine
        run: |
          npm install --no-audit --no-fund
          ./node_modules/.bin/esbuild entry.js --bundle --format=iife --platform=browser --target=es2020 --outfile=../app/src/main/assets/resin-engine.js
          cp vendor/resin/LICENSE ../app/src/main/assets/RESIN-LICENSE.txt
      - name: Check Android chart UI JavaScript
        run: node --check PineLab/app/src/main/assets/app.js
      - name: Test Pine engine on synthetic bars
        working-directory: PineLab
        run: node engine/smoke-test.mjs
      - name: Build debug APK
        working-directory: PineLab
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pinelab-debug-apk
          path: PineLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
