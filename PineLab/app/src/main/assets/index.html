<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d121c"><title>PineLab</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Pine<span>Lab</span></div><div class="status" id="engineStatus">جارٍ الاتصال بسوق الذهب</div></header>
<main>
<section class="toolbar">
<select id="symbol"><option value="XAUUSD">XAUUSD · مدعوم ببيانات السوق</option><option value="EURUSD" disabled>EURUSD · غير متاح حالياً</option><option value="BTCUSD" disabled>BTCUSD · غير متاح حالياً</option><option value="US100" disabled>US100 · غير متاح حالياً</option></select>
<select id="timeframe"><option value="1">1 دقيقة</option><option value="5" selected>5 دقائق</option><option value="15">15 دقيقة</option><option value="60">ساعة</option><option value="240">4 ساعات</option><option value="D">يومي</option></select>
<button id="regen">تحديث السوق</button>
</section>
<section class="chartCard"><div class="chartHead"><b id="chartTitle">XAUUSD · 5m</b><span id="price">—</span><div class="chartTools"><button id="fitChart" type="button">ملاءمة</button><button id="expandChart" type="button">تكبير</button></div></div><canvas id="chart"></canvas><div class="chartFoot"><span id="barsLabel">بانتظار بيانات السوق الحقيقية</span><span id="cursorLabel">آخر شمعة</span></div></section>
<section class="replay">
<button id="step">شمعة ◀</button><button id="play">▶ تشغيل</button><button id="reset">إعادة</button><button id="setReplayStart">تحديد البداية</button><select id="replaySpeed" aria-label="سرعة إعادة التشغيل"><option value="2000">0.25×</option><option value="1000">0.5×</option><option value="500" selected>1×</option><option value="250">2×</option><option value="100">5×</option><option value="50">10×</option></select><input id="replayRange" type="range" min="0" max="0" value="0">
</section>
<section class="editorCard">
<div class="editorHead"><b>محرر Pine</b><div><button id="save">حفظ</button><button id="toggleIndicator">تفعيل</button><button id="run" class="primary">تشغيل المفعّل</button></div></div>
<div class="savedRow"><select id="savedScripts" aria-label="المؤشرات المحفوظة"><option value="">المؤشرات المحفوظة</option></select><button id="loadScript">فتح</button></div>
<div id="indicatorList" class="indicatorList" aria-label="قائمة تشغيل المؤشرات"></div>
<input id="scriptName" value="My Indicator" aria-label="اسم المؤشر">
<textarea id="source" spellcheck="false">//@version=6
indicator("PineLab Test", overlay=true)
fast = ta.ema(close, 9)
slow = ta.ema(close, 21)
plot(fast, "EMA 9", color=color.orange)
plot(slow, "EMA 21", color=color.aqua)
</textarea>
<div id="diagnostics">المحرّك الكامل قيد الدمج. لا يتم الادعاء بتوافق Pine الكامل في هذه النسخة التأسيسية.</div>
</section>
</main>
<script src="resin-engine.js"></script>
<script src="visual-merge.js"></script>
<script src="app.js"></script>
</body></html>
